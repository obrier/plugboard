name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test # offline: the CLI tests drive test/fixtures/fake-claude.ts, never a real account
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # the library's oldest supported Node
      - name: The bridge on real Node (offline, against the fake Claude Code)
        run: bun build scripts/node-bridge-check.ts --target=node --outfile=dist/node-bridge-check.mjs && node dist/node-bridge-check.mjs
      - name: The npm package on real Node (packed, installed, its types checked, a read against the fake Claude Code)
        run: bun scripts/package-check.ts

  # Ubuntu on WSL2, on a hosted Windows runner: the test suite, then the compiled linux-x64 binary,
  # including a planted Windows claude.exe on PATH that plugboard must refuse to use.
  wsl2:
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: Keep LF line endings (the test fixtures are shebang scripts)
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl unzip ca-certificates
      - name: Install Bun inside WSL
        run: curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
      - name: Copy the checkout into the Linux home (not /mnt/<drive>)
        run: |
          cp -r "$(wslpath '${{ github.workspace }}')" ~/plugboard
          chmod +x ~/plugboard/test/fixtures/*.ts ~/plugboard/scripts/*.sh
      - name: Test
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd ~/plugboard
          grep -qi microsoft /proc/sys/kernel/osrelease # this really is WSL
          bun install --frozen-lockfile
          bun test
      - name: Compiled binary on WSL2
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd ~/plugboard
          bun build --compile --target=bun-linux-x64 --outfile=dist/plugboard src/cli.ts
          ./dist/plugboard --version
          ./dist/plugboard --help > /dev/null
          # a Windows Claude Code visible through interop must be named, never used
          mkdir -p /mnt/c/plugboard-trap && touch /mnt/c/plugboard-trap/claude.exe /mnt/c/plugboard-trap/claude
          out=$(PATH="/mnt/c/plugboard-trap:$PATH" ./dist/plugboard doctor --out json || true)
          echo "$out"
          echo "$out" | grep -q '"check":"platform","status":"ok","detail":"wsl-x64'
          echo "$out" | grep -q 'missing or not runnable; found Windows'
          echo "$out" | grep -q 'plugboard-trap/claude.exe'
