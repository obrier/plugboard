# Push a vX.Y.Z tag (npm version patch && git push --follow-tags) to release:
# test → build the four binaries → GitHub release → formula pushed to obrier/homebrew-tap.
# Run it by hand (workflow_dispatch) for a dry run: it builds and uploads the archives as a
# workflow artifact, and publishes nothing.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest # bun cross-compiles the macOS binaries too
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $version"; exit 1; }

      - name: Test, build archives, render formula
        run: scripts/release.sh

      - name: "Dry run: keep the archives as a workflow artifact"
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: plugboard-release
          path: release/

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*/*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes

      - name: Push the formula to obrier/homebrew-tap
        if: github.ref_type == 'tag'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }} # deploy key with write access to the tap only
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:obrier/homebrew-tap.git tap
          mkdir -p tap/Formula && cp release/*/plugboard.rb tap/Formula/plugboard.rb
          cd tap
          git config user.name "plugboard release" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/plugboard.rb
          git commit -m "plugboard ${GITHUB_REF_NAME#v}" && git push
