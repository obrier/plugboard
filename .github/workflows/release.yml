# Push a vX.Y.Z tag (npm version patch && git push --follow-tags) to release:
# test → build the four binaries and the library → GitHub release → formula pushed to obrier/homebrew-tap → npm.
# Run it by hand (workflow_dispatch) for a dry run: it builds and uploads the archives as a
# workflow artifact, packs the library with npm pack --dry-run, and publishes nothing.
# Every publishing step skips what is already done, so re-running a release that failed part-way finishes it.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest # bun cross-compiles the macOS binaries too
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $version"; exit 1; }

      - name: Test, build archives, render formula
        run: scripts/release.sh

      - name: Build the library and list what npm would ship
        run: bun run build:lib && npm pack --dry-run # never asks the registry, unlike npm publish --dry-run

      - name: Keep the library for the npm job
        uses: actions/upload-artifact@v7
        with:
          name: npm-library
          path: dist/lib/

      - name: "Dry run: keep the archives as a workflow artifact"
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: plugboard-release
          path: release/

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "$GITHUB_REF_NAME is already released"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" release/*/*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes

      - name: Push the formula to obrier/homebrew-tap
        if: github.ref_type == 'tag'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }} # deploy key with write access to the tap only
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:obrier/homebrew-tap.git tap
          mkdir -p tap/Formula && cp release/*/plugboard.rb tap/Formula/plugboard.rb
          cd tap
          git config user.name "plugboard release" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/plugboard.rb
          if git diff --cached --quiet; then echo "the tap already has this formula"; exit 0; fi
          git commit -m "plugboard ${GITHUB_REF_NAME#v}" && git push

  # npm trusts this job (trusted publishing, set on the package's settings page on npmjs.com, environment "npm"):
  # no token is stored, and npm adds provenance itself. It alone may ask for an OIDC token, and it installs and
  # runs no dependency: it publishes the library the release job built.
  npm:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5.1 or later
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1); }' "$(npm --version)"
      - uses: actions/download-artifact@v8
        with:
          name: npm-library
          path: dist/lib/
      - name: Publish the library to npm, with provenance
        run: |
          version=$(node -p 'require("./package.json").version')
          # Asked without credentials: setup-node's .npmrc holds a placeholder token until npm exchanges the OIDC one.
          if curl -fsS -o /dev/null "https://registry.npmjs.org/@obrier%2fplugboard/$version"; then echo "@obrier/plugboard@$version is already on npm"; exit 0; fi
          npm publish --access public
